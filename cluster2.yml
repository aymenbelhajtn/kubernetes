kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /home/aymen/nginx-data
        containerPath: /data/nginx
      - hostPath: /opt/kind-volumes
        containerPath: /data/zabbix


  - role: worker
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      - containerPort: 30070
        hostPort: 30070
        protocol: TCP
      - containerPort: 30100
        hostPort: 30100
        protocol: TCP
      - containerPort: 30060
        hostPort: 30060
        protocol: TCP
      - containerPort: 30050
        hostPort: 30050
        protocol: TCP
    extraMounts:
      - hostPath: /home/aymen/nginx-data
        containerPath: /data/nginx
      - hostPath: /opt/kind-volumes
        containerPath: /data/zabbix





