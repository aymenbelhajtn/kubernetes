# kind-longhorn.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /tmp/longhorn-control
        containerPath: /var/lib/longhorn
  - role: worker
    extraMounts:
      - hostPath: /tmp/longhorn-worker1
        containerPath: /var/lib/longhorn
  - role: worker
    extraMounts:
      - hostPath: /tmp/longhorn-worker2
        containerPath: /var/lib/longhorn
